{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if link_url %}<a class="button" href="{{ link_url }}">{{ link_label }}</a>{% endif %}
  {% if request_id %}<p class="muted">Reference: {{ request_id }}</p>{% endif %}
{% endblock %}
