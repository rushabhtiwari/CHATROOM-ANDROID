; Every process KCMS needs, in one container. Output goes to the container's own
; stdout and stderr, so `docker logs kcms` is the one place to look.

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---- data services ---------------------------------------------------------

[program:postgres]
command=su-exec postgres postgres -D /data/postgres
autorestart=true
stopsignal=INT
stopwaitsecs=60
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:valkey]
command=valkey-server --bind 127.0.0.1 --port 6379 --dir /data/valkey --save 300 10 --appendonly no
autorestart=true
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=minio server /data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9090 --quiet
autorestart=true
priority=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- application -----------------------------------------------------------

[program:migrator]
directory=/app/backend
command=./bin/docker-entrypoint-migrator.sh
autorestart=unexpected
exitcodes=0
startsecs=0
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
directory=/app/backend
command=./bin/docker-entrypoint-api.sh
environment=PORT="3004"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
directory=/app/backend
command=./bin/docker-entrypoint-worker.sh
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
directory=/app/backend
command=./bin/docker-entrypoint-beat.sh
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:space]
directory=/app/js/apps/space
command=node node_modules/@react-router/serve/bin.js ./build/server/index.js
environment=PORT="3002",HOSTNAME="127.0.0.1",NODE_ENV="production"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:live]
directory=/app/js
command=node apps/live
environment=PORT="3005",HOSTNAME="127.0.0.1",NODE_ENV="production"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:proxy]
directory=/app/proxy
command=caddy run --config /app/proxy/Caddyfile --adapter caddyfile
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Loads the Kiran demo workspace once, on the first boot of a fresh volume, when the
; container is started with KCMS_SEED_DEMO=1. The marker file keeps later boots quiet.
[program:seed-demo]
command=/bin/bash -c 'if [ "${KCMS_SEED_DEMO:-0}" = "1" ] && [ ! -f /data/.demo-seeded ]; then kcms-seed-demo && touch /data/.demo-seeded; fi'
autorestart=false
startsecs=0
exitcodes=0
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
