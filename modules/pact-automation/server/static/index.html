<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPAC</title>
<!--
  KPAC — Kiran Pact Automation System.
  One file, inline CSS + JS, no CDN and no bundler: this page must work on a PC with no internet.
  Branding: assets/logo.png is used if it exists, otherwise the KPAC wordmark below.
  TODO: drop a square PNG at assets/logo.png to replace the wordmark.
  TODO: if assets/ui-reference.png is supplied, match its palette by editing the tokens in :root.
-->
<style>
  :root {
    --bg:#f4f6fa; --card:#ffffff; --ink:#131a24; --muted:#697585; --faint:#95a0af;
    --line:#e4e8ee; --line2:#eef1f5;
    --accent:#2b5cd9; --accent-soft:#eaf0fd; --accent-ink:#1c3f9e;
    --green:#1f7a45; --green-soft:#e8f6ee;
    --red:#c0322b; --red-soft:#fdecea;
    --amber:#a96a00; --amber-soft:#fff5e3;
    --shadow:0 1px 2px rgba(19,26,36,.05), 0 6px 18px rgba(19,26,36,.06);
    --r:10px;
  }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a { color:var(--accent); text-decoration:none } a:hover { text-decoration:underline }

  /* ---------- top bar ---------- */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
            background:#fff; border-bottom:1px solid var(--line); padding:0 22px; height:60px }
  .brand { display:flex; align-items:center; gap:10px; min-width:220px }
  .brand img { width:30px; height:30px; border-radius:7px; object-fit:contain }
  .wordmark { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
              border-radius:7px; background:var(--accent); color:#fff; font-weight:700; font-size:12px;
              letter-spacing:.02em }
  .brand .name { font-weight:650; font-size:15px; letter-spacing:-.01em }
  .brand .name small { display:block; font-weight:400; font-size:11px; color:var(--faint); letter-spacing:.02em }
  .pills { display:flex; gap:8px; flex-wrap:wrap }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 11px; border-radius:999px;
          border:1px solid var(--line); background:#fbfcfe; color:var(--muted); white-space:nowrap }
  .pill b { color:var(--ink); font-weight:600 }
  .pill.on { border-color:#c4e6d2; background:var(--green-soft); color:var(--green) }
  .pill.on b { color:var(--green) }
  .pill.warn { border-color:#f2d9ae; background:var(--amber-soft); color:var(--amber) }
  .pill.warn b { color:var(--amber) }
  .pill.bad { border-color:#f2c4c0; background:var(--red-soft); color:var(--red) }
  .pill.bad b { color:var(--red) }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block }

  .drybanner { background:#ffd93d; color:#4a3800; font-weight:700; letter-spacing:.03em;
               text-align:center; padding:9px 14px; font-size:13px; border-bottom:1px solid #e5bd1f }

  /* ---------- shell ---------- */
  .shell { display:grid; grid-template-columns:216px 1fr; min-height:calc(100vh - 60px); align-items:start }
  nav { position:sticky; top:60px; padding:18px 12px; border-right:1px solid var(--line); background:#fff;
        min-height:calc(100vh - 60px) }
  nav button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit;
               padding:9px 12px; margin-bottom:3px; border:0; border-radius:8px; background:none;
               color:var(--muted); cursor:pointer }
  nav button:hover { background:var(--line2); color:var(--ink) }
  nav button.sel { background:var(--accent-soft); color:var(--accent-ink); font-weight:600 }
  nav .glyph { width:18px; text-align:center; opacity:.9 }
  nav .navhead { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint);
                 padding:12px 12px 6px }
  main { padding:22px 26px 60px; max-width:1500px }

  h1.page { font-size:20px; margin:0 0 3px; letter-spacing:-.01em }
  .page-sub { color:var(--muted); margin:0 0 20px }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
          box-shadow:var(--shadow); padding:18px; margin-bottom:18px }
  .card > h2 { font-size:12px; margin:0 0 14px; color:var(--faint); text-transform:uppercase; letter-spacing:.07em }
  .card.flat { box-shadow:none }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start }
  .grid-side { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start }
  @media (max-width:1240px) { .grid-side { grid-template-columns:1fr } }

  /* ---------- kpi tiles ---------- */
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px }
  @media (max-width:1180px) { .tiles { grid-template-columns:repeat(2,1fr) } }
  .tile { background:#fff; border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px 18px }
  .tile .k { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint) }
  .tile .v { font-size:28px; font-weight:650; letter-spacing:-.02em; margin-top:6px; line-height:1.1 }
  .tile .v small { font-size:14px; font-weight:500; color:var(--muted) }
  .tile.good .v { color:var(--green) } .tile.bad .v { color:var(--red) }

  /* ---------- forms & buttons ---------- */
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px }
  input[type=text], input[type=number], select, textarea {
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; color:var(--ink) }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent) }
  textarea { min-height:60px; resize:vertical }
  input[type=file] { font:inherit; width:100% }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .spread { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap }
  button { font:inherit; padding:8px 14px; border-radius:7px; border:1px solid var(--line); background:#fff;
           color:var(--ink); cursor:pointer }
  button:hover:not(:disabled) { background:#f7f9fc }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  button.primary:hover:not(:disabled) { background:#2450c4 }
  button.ok { background:var(--green); color:#fff; border-color:var(--green) }
  button.ok:hover:not(:disabled) { background:#1a6a3b }
  button.danger { color:var(--red); border-color:#f0cdca }
  button.small { padding:4px 9px; font-size:12px }
  button:disabled { opacity:.45; cursor:not-allowed }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x:auto }
  table { width:100%; border-collapse:collapse }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line2); vertical-align:top }
  th { font-size:11px; color:var(--faint); font-weight:600; text-transform:uppercase; letter-spacing:.05em;
       border-bottom:1px solid var(--line); white-space:nowrap }
  tbody tr:hover { background:#fafbfd }
  tr.now { background:var(--accent-soft) !important; box-shadow:inset 3px 0 0 var(--accent) }
  tr.blocked { background:#fff9f9 }
  td.num { font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap }

  /* ---------- status chips ---------- */
  .st { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 10px; border-radius:999px;
        background:var(--line2); color:var(--muted); white-space:nowrap; font-weight:500 }
  .st.approved { background:var(--accent-soft); color:var(--accent-ink) }
  .st.filling, .st.verifying, .st.saving { background:var(--amber-soft); color:var(--amber) }
  .st.awaiting_save { background:#fff8e1; color:#8a6d00 }
  .st.saved { background:var(--green-soft); color:var(--green) }
  .st.failed { background:var(--red-soft); color:var(--red) }
  .st.rejected, .st.skipped { background:#f1f3f6; color:var(--faint) }
  .st.running { background:var(--amber-soft); color:var(--amber) }
  .st.paused { background:#fff8e1; color:#8a6d00 }
  .st.done { background:var(--green-soft); color:var(--green) }
  .st.draft { background:var(--line2); color:var(--muted) }
  .st.stopping { background:var(--red-soft); color:var(--red) }
  .spin { width:11px; height:11px; border:2px solid rgba(0,0,0,.15); border-top-color:currentColor;
          border-radius:50%; animation:sp .8s linear infinite; display:inline-block }
  @keyframes sp { to { transform:rotate(360deg) } }

  /* ---------- progress ---------- */
  .bar { height:9px; background:var(--line2); border-radius:999px; overflow:hidden; margin:12px 0 8px }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease }
  .bar.dry > i { background:#e0a800 }

  .muted { color:var(--muted) } .faint { color:var(--faint) }
  .small { font-size:12px } .mono { font:12px/1.5 ui-monospace,Consolas,"Courier New",monospace }
  .err { color:var(--red); font-size:12px }
  .warn { color:var(--amber); font-size:12px }
  .rid { color:var(--green); font-weight:600; font-variant-numeric:tabular-nums }
  .log { white-space:pre-wrap; font:12px/1.45 ui-monospace,Consolas,monospace; background:#101822; color:#d5e0ea;
         padding:12px; border-radius:8px; max-height:300px; overflow:auto; margin-top:8px }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:8px; margin-top:8px }
  details > summary { cursor:pointer; color:var(--accent); font-size:12px }
  .empty { padding:26px; text-align:center; color:var(--faint) }
  .kv { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted) }
  .kv span b { color:var(--ink); font-weight:600 }
  .note { background:var(--accent-soft); border:1px solid #cfdcfa; color:var(--accent-ink); padding:10px 12px;
          border-radius:8px; font-size:13px }
  .note.amber { background:var(--amber-soft); border-color:#f0dcb2; color:#7a4d00 }
  .note.red { background:var(--red-soft); border-color:#f2c4c0; color:var(--red) }
  .steps { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px }
  .step { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--faint) }
  .step.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); font-weight:600 }
  .step.past { border-color:#c4e6d2; background:var(--green-soft); color:var(--green) }
</style>
</head>
<body>

<div id="dry" class="drybanner" style="display:none">DRY RUN — nothing will be saved</div>

<header class="topbar">
  <div class="brand">
    <img id="logo" src="/assets/logo.png" alt="" onerror="this.style.display='none';document.getElementById('mark').style.display='inline-flex'">
    <span id="mark" class="wordmark" style="display:none">KP</span>
    <span class="name">KPAC<small>Kiran Pact Automation System</small></span>
  </div>
  <div class="pills" id="pills"></div>
  <span style="flex:1"></span>
  <button class="small" onclick="reloadSettings()" title="Re-read .env">Reload .env</button>
</header>

<div class="shell">
  <nav>
    <div class="navhead">Operations</div>
    <button data-view="dashboard" onclick="go('dashboard')"><span class="glyph">▤</span> Dashboard</button>
    <button data-view="batches" onclick="go('batches')"><span class="glyph">⇪</span> Batches</button>
    <button data-view="manual" onclick="go('manual')"><span class="glyph">✎</span> Manual entry</button>
    <div class="navhead">System</div>
    <button data-view="settings" onclick="go('settings')"><span class="glyph">⚙</span> Settings</button>
  </nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
"use strict";
const S = {
  view: "dashboard", status: null, entries: [], batches: [],
  batch: null, batchId: null, excluded: new Set(),
  openLogs: new Set(), sigs: {}
};

/* ------------------------------------------------------------------ helpers */
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function secs(n) {
  if (n === null || n === undefined || n === "") return "—";
  n = Math.round(n);
  if (n < 60) return n + "s";
  const m = Math.floor(n / 60);
  return m + "m " + String(n % 60) + "s";
}
function when(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "—"; }
function timeOnly(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString() : "—"; }
function chip(s) {
  const busy = ["filling","verifying","saving","running","stopping"].includes(s);
  return `<span class="st ${esc(s)}">${busy ? '<span class="spin"></span>' : ""}${esc(String(s).replace(/_/g," "))}</span>`;
}
function cell(v) {
  if (Array.isArray(v)) return v.map(x => typeof x === "object"
      ? `${x.product_code ?? ""}|${x.qty ?? ""}|${x.unit_price ?? ""}` : String(x)).join("; ");
  if (typeof v === "boolean") return v ? "true" : "false";
  return v ?? "";
}
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json().catch(() => null) : await r.text();
  if (!r.ok) throw new Error((body && body.detail) || (typeof body === "string" && body) || r.statusText);
  return body;
}
function fail(e) { alert(e.message || e); }

/* ------------------------------------------------------------------ routing */
function go(view, arg) {
  S.view = view;
  if (view === "batch") S.batchId = arg;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("sel", b.dataset.view === (view === "batch" ? "batches" : view)));
  S.sigs = {};
  render(true);
}

/* ------------------------------------------------------------------ polling */
async function tick() {
  try {
    S.status = await api("/api/status");
    paintChrome();
    if (S.view === "dashboard" || S.view === "manual") S.entries = await api("/api/entries?limit=120");
    if (S.view === "batches") S.batches = await api("/api/batches");
    if (S.view === "batch" && S.batchId) S.batch = await api("/api/batches/" + S.batchId);
    render(false);
  } catch (e) { /* server restarting - the next tick will pick it up */ }
}

function paintChrome() {
  const s = S.status, st = s.settings;
  $("dry").style.display = st.dry_run ? "block" : "none";
  const worker = s.busy ? "busy on #" + s.current : (s.worker_alive ? "idle" : "stopped");
  const cls = s.busy ? "warn" : (s.worker_alive ? "on" : "bad");
  $("pills").innerHTML =
    `<span class="pill ${s.profile_ok ? "" : "bad"}">profile <b>${esc(st.profile)}</b>${s.profile_ok ? "" : " · missing!"}</span>` +
    `<span class="pill ${cls}"><span class="dot"></span>worker <b>${esc(worker)}</b></span>` +
    `<span class="pill ${st.dry_run ? "warn" : "on"}">mode <b>${esc(st.mode)}</b></span>` +
    `<span class="pill">verifier <b>${esc(st.model)}</b></span>`;
}

/* ------------------------------------------------------------------ render */
function render(force) {
  if (!S.status) return;
  const painters = { dashboard: viewDashboard, batches: viewBatches, batch: viewBatch,
                     manual: viewManual, settings: viewSettings };
  const html = painters[S.view]();
  if (!force && html === S.sigs.html) return;
  // keep whatever the operator is halfway through typing across a background repaint
  const keep = {};
  $("main").querySelectorAll("input,select,textarea").forEach(el => {
    if (el.id) keep[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  $("main").innerHTML = html;
  S.sigs.html = html;
  if (!force) $("main").querySelectorAll("input,select,textarea").forEach(el => {
    if (el.id && el.id in keep && el.type !== "file") {
      if (el.type === "checkbox") el.checked = keep[el.id]; else el.value = keep[el.id];
    }
  });
}

/* ------------------------------------------------------------------ dashboard */
function viewDashboard() {
  const s = S.status, k = s.kpis || {}, b = s.batch;
  const tiles = `
    <div class="tiles">
      <div class="tile good"><div class="k">Saved today</div><div class="v">${k.saved_today ?? 0}</div></div>
      <div class="tile ${k.failed_today ? "bad" : ""}"><div class="k">Failed today</div><div class="v">${k.failed_today ?? 0}</div></div>
      <div class="tile"><div class="k">Avg per record</div><div class="v">${k.avg_seconds ? k.avg_seconds + "<small>s</small>" : "—"}</div></div>
      <div class="tile"><div class="k">Batches run</div><div class="v">${k.batches_run ?? 0}</div></div>
    </div>`;

  const stepOrder = ["filling", "verifying", "saving"];
  const step = s.step || "";
  const now = s.busy ? `
    <div class="card">
      <h2>Now processing</h2>
      <div class="spread">
        <div>
          <div style="font-size:15px;font-weight:600">Entry #${s.current}${s.batch_id ? ` <span class="faint small">· batch #${s.batch_id}</span>` : ""}</div>
          <div class="kv" style="margin-top:6px">${Object.entries(s.current_record || {}).map(([kk, vv]) =>
              `<span><b>${esc(kk)}</b>: ${esc(cell(vv))}</span>`).join(" · ") || '<span class="faint">—</span>'}</div>
          <div class="steps">${stepOrder.map(x =>
              `<span class="step ${x === step ? "on" : (stepOrder.indexOf(x) < stepOrder.indexOf(step) ? "past" : "")}">${x}</span>`).join("")}</div>
        </div>
        ${chip(step || "filling")}
      </div>
    </div>` : `
    <div class="card"><h2>Now processing</h2>
      <div class="spread"><div class="muted">Nothing running. The worker is ${s.worker_alive ? "idle and waiting" : "<b>stopped</b>"}.</div>${chip("pending")}</div>
    </div>`;

  const batchCard = b ? batchProgressCard(b, true) : "";

  const recent = S.entries.slice(0, 12);
  const activity = `
    <div class="card">
      <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">Recent activity</h2>
        <span class="faint small">last ${recent.length} entries</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th style="width:56px">#</th><th>Record</th><th style="width:140px">Status</th>
          <th style="width:120px">Document</th><th style="width:90px">Time</th></tr></thead>
        <tbody>${recent.length ? recent.map(e => `
          <tr>
            <td class="num">${e.id}</td>
            <td><div class="kv">${Object.entries(e.record).slice(0, 4).map(([kk, vv]) =>
                `<span><b>${esc(kk)}</b>: ${esc(cell(vv))}</span>`).join(" · ")}</div>
                ${e.error ? `<div class="err">${esc(e.error)}</div>` : ""}</td>
            <td>${chip(e.status)}</td>
            <td class="rid">${esc(e.result?.confirmation?.record_id || "")}</td>
            <td class="num">${timeOnly(e.updated_at)}</td>
          </tr>`).join("") : `<tr><td colspan="5" class="empty">No entries yet. Upload a batch to get started.</td></tr>`}
        </tbody></table></div>
    </div>`;

  return `<h1 class="page">Dashboard</h1><p class="page-sub">Live view of the robot, the current batch and today's numbers.</p>
          ${tiles}${batchCard}${now}${activity}`;
}

function batchProgressCard(b, linkOut) {
  const c = b.counts || {}, done = c.done || 0, total = c.total || 0;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const eta = b.eta_seconds ? ` · est. ${secs(b.eta_seconds)} left` : "";
  const dry = (b.mode || "").indexOf("DRY") === 0;
  const paused = b.status === "paused";
  return `
    <div class="card">
      <div class="spread">
        <div><h2 style="margin:0 0 4px">Batch #${b.id} — ${esc(b.name)}</h2>
          <span class="faint small">${esc(b.mode || "")} · profile ${esc(b.profile || "")}</span></div>
        <div class="row">${chip(b.status)}
          ${b.status === "running" ? `<button class="small" onclick="batchAct(${b.id},'pause')">Pause</button>
             <button class="small danger" onclick="batchAct(${b.id},'stop')">Stop after current</button>` : ""}
          ${paused ? `<button class="small primary" onclick="batchAct(${b.id},'resume')">Resume</button>` : ""}
          ${linkOut ? `<button class="small" onclick="go('batch',${b.id})">Open</button>` : ""}
        </div>
      </div>
      <div class="bar ${dry ? "dry" : ""}"><i style="width:${pct}%"></i></div>
      <div class="spread small muted"><span><b>${done} / ${total}</b>${eta}</span>
        <span>${c.saved || 0} saved · ${c.failed || 0} failed · ${c.skipped || 0} skipped${b.elapsed_seconds ? " · " + secs(b.elapsed_seconds) + " elapsed" : ""}</span></div>
      ${paused ? `<div class="note amber" style="margin-top:12px"><b>Batch paused.</b> ${esc(b.pause_reason || "")}</div>` : ""}
    </div>`;
}

/* ------------------------------------------------------------------ batches */
function viewBatches() {
  const rows = S.batches.map(b => {
    const c = b.counts || {};
    return `<tr>
      <td class="num">${b.id}</td>
      <td><a href="#" onclick="go('batch',${b.id});return false">${esc(b.name)}</a>
          <div class="faint small">${esc(b.source || "")}</div></td>
      <td>${chip(b.status)}</td>
      <td class="num">${b.mode || ""}</td>
      <td class="num">${c.total || 0}</td>
      <td class="num" style="color:var(--green)">${c.saved || 0}</td>
      <td class="num" style="color:var(--red)">${c.failed || 0}</td>
      <td class="num">${c.skipped || 0}</td>
      <td class="num">${when(b.started_at || b.created_at)}</td>
      <td class="row">
        <button class="small" onclick="go('batch',${b.id})">Open</button>
        ${b.status === "done" ? `<a class="small" href="/api/batches/${b.id}/report.html" target="_blank">Report</a>` : ""}
      </td></tr>`;
  }).join("");

  return `<h1 class="page">Batches</h1>
    <p class="page-sub">Upload a file, check the pre-flight table, approve once. Everything after that is unattended.</p>
    <div class="grid-side">
      <div>
        <div class="card">
          <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">All batches</h2>
            <span class="faint small">${S.batches.length} total</span></div>
          <div class="tablewrap"><table>
            <thead><tr><th style="width:50px">#</th><th>Name</th><th style="width:110px">Status</th>
              <th style="width:80px">Mode</th><th style="width:60px">Rows</th><th style="width:60px">Saved</th>
              <th style="width:60px">Failed</th><th style="width:70px">Skipped</th><th style="width:160px">Started</th>
              <th style="width:150px"></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="10" class="empty">No batches yet — upload a file on the right.</td></tr>`}</tbody>
          </table></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2>New batch</h2>
          <p class="small muted" style="margin-top:0">CSV or Excel (.xlsx). Column headers must match the
            profile's field keys: <span class="mono">${(S.status.fields || []).map(f => esc(f.key)).join(", ")}</span>${
              S.status.has_grid ? `, plus <span class="mono">line_items</span> as <span class="mono">CODE|QTY|PRICE; CODE|QTY|PRICE</span>` : ""}.</p>
          <label for="bname">Batch name (optional)</label>
          <input type="text" id="bname" placeholder="e.g. POs 4 Sep morning">
          <label for="bfile">File</label>
          <input type="file" id="bfile" accept=".csv,.xlsx,.xlsm">
          <div class="row" style="margin-top:14px">
            <button class="primary" onclick="uploadBatch()">Upload &amp; pre-flight</button>
            <a class="small" href="/api/sample.csv">sample file</a>
          </div>
          <p class="small faint" style="margin-bottom:0">Uploading only checks the rows. Nothing is typed
            into ${esc(S.status.settings.profile)} until you approve the batch.</p>
        </div>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ one batch */
function viewBatch() {
  const b = S.batch;
  if (!b) return `<div class="empty">Loading batch…</div>`;
  const draft = b.status === "draft";
  const done = b.status === "done";
  const cols = (b.columns || []).filter(c => (b.entries || []).some(e => e.record[c] !== undefined && e.record[c] !== ""));
  const hasItems = entries.some(e => Array.isArray(e.record.line_items));
  const entries = b.entries || [];
  const blocked = entries.filter(e => e.errors.length).length;
  const warned = entries.filter(e => e.warnings.length).length;

  const head = `<div class="spread" style="margin-bottom:6px">
      <div><h1 class="page">Batch #${b.id} — ${esc(b.name)}</h1>
        <p class="page-sub" style="margin:0">${esc(b.source || "manual")} · profile ${esc(b.profile || "")}
          ${b.mode ? "· " + esc(b.mode) : ""} · created ${when(b.created_at)}</p></div>
      <div class="row">${chip(b.status)}<button class="small" onclick="go('batches')">← All batches</button></div>
    </div>`;

  let action = "";
  if (draft) {
    const willRun = entries.filter(e => !S.excluded.has(e.row_no) && !e.errors.length).length;
    action = `
      <div class="card">
        <div class="spread">
          <div>
            <div style="font-size:15px;font-weight:600">Pre-flight</div>
            <div class="small muted">${entries.length} row(s) read ·
              <b style="color:${blocked ? "var(--red)" : "inherit"}">${blocked} blocking</b> ·
              ${warned} with warnings · <b>${willRun}</b> will run</div>
          </div>
          <button class="ok" ${willRun ? "" : "disabled"} onclick="approveBatch(${b.id},${willRun})">
            Approve batch &amp; start</button>
        </div>
        ${blocked ? `<div class="note red" style="margin-top:12px"><b>${blocked} row(s) cannot run.</b>
          They are unticked below and will be marked skipped. Fix the file and upload again, or run the rest.</div>` : ""}
        <div class="note ${S.status.settings.dry_run ? "amber" : ""}" style="margin-top:12px">
          This is the only approval in the flow. The robot will fill, read back, screenshot, ask
          ${esc(S.status.settings.model)} to verify, and ${S.status.settings.dry_run
            ? "<b>stop before saving (DRY RUN)</b>" : "press <b>Save</b> only when the check passes"} — row by row, in file order.</div>
      </div>`;
  } else if (b.status !== "draft") {
    action = batchProgressCard(b, false);
  }

  const summary = done ? `
    <div class="card">
      <div class="spread" style="margin-bottom:14px"><h2 style="margin:0">Summary</h2>
        <div class="row">
          <a href="/api/batches/${b.id}/report.csv"><button class="small">Download report (CSV)</button></a>
          <a href="/api/batches/${b.id}/report.html" target="_blank"><button class="small">Download report (printable HTML)</button></a>
        </div></div>
      <div class="tiles" style="margin-bottom:0">
        <div class="tile good"><div class="k">Saved</div><div class="v">${b.counts.saved}</div></div>
        <div class="tile ${b.counts.failed ? "bad" : ""}"><div class="k">Failed</div><div class="v">${b.counts.failed}</div></div>
        <div class="tile"><div class="k">Skipped</div><div class="v">${b.counts.skipped}</div></div>
        <div class="tile"><div class="k">Elapsed / avg</div><div class="v">${secs(b.elapsed_seconds)}
          <small> · ${b.avg_seconds ? b.avg_seconds + "s ea" : "—"}</small></div></div>
      </div>
    </div>` : "";

  const rows = entries.map(e => {
    const isNow = b.current_entry === e.id;
    const cls = isNow ? "now" : (draft && e.errors.length ? "blocked" : "");
    const tick = draft ? `<input type="checkbox" ${e.errors.length || S.excluded.has(e.row_no) ? "" : "checked"}
        ${e.errors.length ? "disabled" : ""} onchange="toggleRow(${e.row_no}, this.checked)">` : "";
    const problems = [
      ...e.errors.map(x => `<div class="err">✕ ${esc(x)}</div>`),
      ...e.warnings.map(x => `<div class="warn">! ${esc(x)}</div>`),
      ...(e.error && !draft ? [`<div class="err">${esc(e.error)}</div>`] : []),
      ...e.mismatches.map(m => `<div class="err">${esc(m.field)}: expected "${esc(m.expected)}", saw "${esc(m.seen)}" (${esc(m.source)})</div>`),
      ...(e.price_notes || []).map(n => `<div class="warn">! ${esc(n)}</div>`)
    ].join("");
    return `<tr class="${cls}">
      <td class="num">${draft ? tick + " " : ""}${e.row_no}</td>
      ${cols.map(c => `<td>${esc(cell(e.record[c]))}</td>`).join("")}
      ${hasItems ? `<td class="mono small">${esc(cell(e.record.line_items))}</td>` : ""}
      <td>${chip(e.status)}</td>
      <td class="rid">${esc(e.document_no || "")}</td>
      <td class="num">${e.seconds ? e.seconds + "s" : ""}</td>
      <td>${problems || '<span class="faint small">—</span>'}</td>
    </tr>`;
  }).join("");

  const table = `
    <div class="card">
      <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">${draft ? "Rows to run" : "Rows"}</h2>
        <span class="faint small">${entries.length} row(s)</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th style="width:70px">Row</th>
          ${cols.map(c => `<th>${esc(c)}</th>`).join("")}
          ${hasItems ? "<th>Line items</th>" : ""}
          <th style="width:120px">Status</th><th style="width:110px">Document</th>
          <th style="width:60px">Secs</th><th style="width:280px">Problems</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="9" class="empty">No rows.</td></tr>`}</tbody>
      </table></div>
    </div>`;

  return head + action + summary + table;
}

function toggleRow(rowNo, checked) { checked ? S.excluded.delete(rowNo) : S.excluded.add(rowNo); S.sigs = {}; }

async function uploadBatch() {
  const f = $("bfile").files[0];
  if (!f) return alert("Choose a CSV or .xlsx file first.");
  const fd = new FormData();
  fd.append("file", f);
  fd.append("name", $("bname").value || "");
  try {
    const b = await api("/api/batches/upload", { method: "POST", body: fd });
    S.excluded = new Set(b.entries.filter(e => e.errors.length).map(e => e.row_no));
    S.batch = b;
    go("batch", b.id);
  } catch (e) { fail(e); }
}

async function approveBatch(bid, count) {
  const mode = S.status.settings.dry_run ? "DRY RUN — nothing will be saved" : "LIVE — records will be SAVED in PACT";
  if (!confirm(`Approve batch #${bid}?\n\n${count} row(s) will be filled, verified and saved one by one.\nMode: ${mode}\n\nThis is the only approval — the robot runs unattended after this.`)) return;
  try {
    await api(`/api/batches/${bid}/start`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ exclude: [...S.excluded] })
    });
    S.sigs = {}; tick();
  } catch (e) { fail(e); }
}

async function batchAct(bid, what) {
  if (what === "stop" && !confirm("Stop this batch after the row that is running now?")) return;
  try { await api(`/api/batches/${bid}/${what}`, { method: "POST" }); S.sigs = {}; tick(); }
  catch (e) { fail(e); }
}

/* ------------------------------------------------------------------ manual entry */
function viewManual() {
  const fields = S.status.fields || [];
  const form = fields.map(f => {
    const id = "f_" + f.key;
    if (f.type === "check") return `<label style="margin-top:12px"><input type="checkbox" id="${id}"> ${esc(f.label)}</label>`;
    if (f.options) return `<label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>
        <select id="${id}"><option value=""></option>${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
    if (f.key === "notes" || f.key === "narration") return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}"></textarea>`;
    return `<label for="${id}">${esc(f.label)}${f.required ? " *" : ""}${f.tab ? ` <span class="faint">· ${esc(f.tab)} tab</span>` : ""}</label>
            <input type="text" id="${id}" ${f.type === "date" ? 'placeholder="dd/mm/yyyy"' : ""}>`;
  }).join("");

  const loose = S.entries.filter(e => !e.batch_id);
  const rows = loose.map(e => {
    const busy = ["filling","verifying","saving"].includes(e.status);
    const rid = e.result?.confirmation?.record_id;
    const verd = e.result?.verifier;
    let extra = "";
    if (rid) extra += `<div class="rid">✔ ${esc(e.result.confirmation.text || rid)}</div>`;
    if (e.error) extra += `<div class="err">${esc(e.error)}</div>`;
    if (verd && !verd.ok) extra += verd.mismatches.map(m =>
      `<div class="err">${esc(m.field)}: expected "${esc(m.expected)}", saw "${esc(m.seen)}" (${esc(m.source)})</div>`).join("");
    if (verd?.ok) extra += `<div class="faint small">verified by ${esc(verd.model)} — ${esc(verd.note || "")}</div>`;
    let actions = "";
    if (["pending","failed","rejected","skipped"].includes(e.status)) actions += `<button class="small ok" onclick="act(${e.id},'approve')">Approve</button> `;
    if (e.status === "pending") actions += `<button class="small" onclick="act(${e.id},'reject')">Reject</button> `;
    if (e.status === "awaiting_save" && !S.status.settings.dry_run) actions += `<button class="small primary" onclick="act(${e.id},'save')">Save now</button> `;
    if (!busy) actions += `<button class="small danger" onclick="del(${e.id})">✕</button>`;
    const open = S.openLogs.has(e.id);
    return `<tr>
      <td class="num">${e.id}</td>
      <td><div class="kv">${Object.entries(e.record).map(([k, v]) => `<span><b>${esc(k)}</b>: ${esc(cell(v))}</span>`).join(" · ")}</div>
          ${extra}
          <details ${open ? "open" : ""}><summary onclick="toggleLog(${e.id})">run log</summary>
            ${open ? `<div class="log">${esc(e.log || "(no log yet)")}</div>` +
              (e.result?.screenshot ? `<img class="shot" src="/api/entries/${e.id}/screenshot?t=${e.updated_at}">` : "") : ""}
          </details></td>
      <td>${chip(e.status)}</td>
      <td class="row">${actions}</td></tr>`;
  }).join("");

  return `<h1 class="page">Manual entry</h1>
    <p class="page-sub">One-off records. Each one still needs its own approval — for volume use a batch.</p>
    <div class="grid-side">
      <div class="card">
        <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">Queue</h2>
          <button class="small ok" onclick="approveAll()">Approve all pending</button></div>
        <div class="tablewrap"><table>
          <thead><tr><th style="width:56px">#</th><th>Record</th><th style="width:130px">Status</th><th style="width:220px">Actions</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">Nothing queued.</td></tr>`}</tbody>
        </table></div>
      </div>
      <div class="card">
        <h2>New entry</h2>
        <form id="mform" onsubmit="return addEntry(event)">${form}</form>
        ${S.status.has_grid ? `<label for="f_line_items">Line items <span class="faint">CODE|QTY|PRICE; …</span></label>
          <input type="text" id="f_line_items" placeholder="PRD-001|10|250; PRD-002|4|1200">` : ""}
        <div class="row" style="margin-top:14px">
          <button class="primary" type="submit" form="mform">Add to queue</button>
          <button type="button" onclick="fillSample()">Fill sample</button>
        </div>
      </div>
    </div>`;
}

function readForm() {
  const rec = {};
  for (const f of S.status.fields || []) {
    const el = $("f_" + f.key);
    if (!el) continue;
    if (f.type === "check") rec[f.key] = el.checked;
    else if (el.value.trim() !== "") rec[f.key] = el.value.trim();
  }
  const li = $("f_line_items");
  if (li && li.value.trim()) {
    rec.line_items = li.value.split(";").map(s => s.trim()).filter(Boolean).map(s => {
      const [product_code, qty, unit_price] = s.split("|").map(x => (x || "").trim());
      return { product_code, qty, unit_price };
    });
  }
  return rec;
}

async function addEntry(ev) {
  ev.preventDefault();
  const rec = readForm();
  if (!Object.keys(rec).length) return alert("Fill something in first.");
  try { await api("/api/entries", { method: "POST", headers: { "content-type": "application/json" },
                                    body: JSON.stringify({ record: rec }) }); }
  catch (e) { fail(e); }
  $("mform").reset();
  if ($("f_line_items")) $("f_line_items").value = "";
  S.sigs = {}; tick();
  return false;
}

function fillSample() {
  const s = S.status.has_grid
    ? { doc_date: new Date().toLocaleDateString("en-GB"), vendor_name: "TYPE AN EXACT VENDOR FROM THE MASTER",
        mode_of_transport: "By Road", transporter: "Local", delivery_terms: "Ex-works",
        payment_terms: "30 days", narration: "Test draft" }
    : { customer_name: "Sharma Traders", phone: "9820011223", email: "accounts@sharmatraders.in",
        city: "Mumbai", credit_limit: "50000", active: true, notes: "Net 30 terms" };
  for (const f of S.status.fields || []) {
    const el = $("f_" + f.key);
    if (!el || !(f.key in s)) continue;
    if (f.type === "check") el.checked = !!s[f.key]; else el.value = s[f.key];
  }
  if ($("f_line_items")) $("f_line_items").value = "PRODUCT-CODE-1|10|250";
}

async function act(id, what) { try { await api(`/api/entries/${id}/${what}`, { method: "POST" }); } catch (e) { fail(e); } S.sigs = {}; tick(); }
async function del(id) { if (confirm("Delete entry #" + id + "?")) { await api("/api/entries/" + id, { method: "DELETE" }); S.sigs = {}; tick(); } }
async function approveAll() { await api("/api/entries/approve-all", { method: "POST" }); S.sigs = {}; tick(); }
function toggleLog(id) { S.openLogs.has(id) ? S.openLogs.delete(id) : S.openLogs.add(id); S.sigs = {}; }

/* ------------------------------------------------------------------ settings */
function viewSettings() {
  const s = S.status, st = s.settings;
  const rows = (s.fields || []).map(f => `<tr>
      <td class="mono">${esc(f.key)}</td><td>${esc(f.label)}</td><td>${esc(f.type)}</td>
      <td>${f.required ? "yes" : ""}</td><td>${esc(f.tab || "")}</td>
      <td class="small muted">${f.options ? esc(f.options.join(", ")) : ""}</td></tr>`).join("");
  return `<h1 class="page">Settings</h1>
    <p class="page-sub">Everything here comes from <span class="mono">.env</span>. Edit that file, then press
      <b>Reload .env</b> in the top bar.</p>
    <div class="grid2">
      <div class="card">
        <h2>Current configuration</h2>
        <table>
          <tr><td class="muted">Profile</td><td><b>${esc(st.profile)}</b> ${s.profile_ok ? "" : '<span class="err">— could not be loaded: ' + esc(s.profile_error || "") + "</span>"}</td></tr>
          <tr><td class="muted">Mode</td><td><b>${esc(st.mode)}</b> ${st.dry_run ? "— fills and verifies, never saves" : "— saves after the verifier passes"}</td></tr>
          <tr><td class="muted">Auto-save</td><td>${st.auto_save ? "yes" : "no — loose entries wait for a Save click"} <span class="faint small">(batches always save automatically; the batch approval is the approval)</span></td></tr>
          <tr><td class="muted">Vision check</td><td><b>${esc(st.verify_mode || "every")}</b> <span class="faint small">(the exact read-back check always runs; this is only the Claude screenshot check)</span></td></tr>
          <tr><td class="muted">Verifier model</td><td class="mono">${esc(st.model)}</td></tr>
          <tr><td class="muted">Worker</td><td>${s.worker_alive ? "running" : '<span class="err">stopped</span>'}${s.last_error ? ' <span class="err">' + esc(s.last_error) + "</span>" : ""}</td></tr>
        </table>
        <div class="note" style="margin-top:14px">To point KPAC at a different PACT screen: run
          <span class="mono">python discovery\\discover.py --title "PACT RevenU"</span>, build a profile from the
          dump, then set <span class="mono">PROFILE=&lt;name&gt;</span> in <span class="mono">.env</span> and reload.</div>
      </div>
      <div class="card">
        <h2>How a record is processed</h2>
        <ol class="muted" style="margin:0; padding-left:18px">
          <li>Attach to the ${esc(st.profile)} window — never a login screen.</li>
          <li>Click New for a fresh, unlocked draft.</li>
          <li>Fill every mapped field by automation id; switch tabs once per tab; type line items into the grid.</li>
          <li>Read every value back off the screen.</li>
          <li>Screenshot the window and ask ${esc(st.model)} whether it matches.</li>
          <li>Only then Save Draft — and capture the document number.</li>
        </ol>
        <div class="note amber" style="margin-top:14px">The <b>Post</b> button is never touched. Save Draft
          does not commit anything to the books.</div>
      </div>
    </div>
    <div class="card">
      <div class="spread" style="margin-bottom:12px"><h2 style="margin:0">Profile fields — ${esc(st.profile)}</h2>
        <a class="small" href="/api/sample.csv">download a matching sample file</a></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Column in your file</th><th>Label on screen</th><th>Type</th><th>Required</th><th>Tab</th><th>Allowed values</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" class="empty">Profile could not be read.</td></tr>`}</tbody>
      </table></div>
      ${s.has_grid ? `<p class="small muted" style="margin-bottom:0">This profile has a line-item grid: add a
        <span class="mono">line_items</span> column shaped
        <span class="mono">CODE|QTY|PRICE; CODE|QTY|PRICE</span>. Product Name, HSN, GST and TOTAL are computed by
        PACT and are never typed.</p>` : ""}
    </div>`;
}

async function reloadSettings() { try { await api("/api/settings/reload", { method: "POST" }); S.sigs = {}; tick(); } catch (e) { fail(e); } }

/* ------------------------------------------------------------------ boot */
go("dashboard");
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
