<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch and the home
      indicator; the safe-area padding in the Tailwind config is what keeps
      content out from under them.
      user-scalable=no because pinch-zooming a chat is never the intent, and
      iOS otherwise zooms the whole app when a text field is focused.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- No tab to show an icon in; this stops the WebView asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>KiranOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
